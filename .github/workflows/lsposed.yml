name: LSPosed module

on:
  push:
    branches:
      - lsposed
    tags:
      - 'v*-lsposed'
  pull_request:
    branches:
      - lsposed
    paths:
      - 'xposed/**'
      - 'integrations/runtime/**'
      - '.github/workflows/lsposed.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build LSPosed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-lsposed-gradle-${{ hashFiles('xposed/**/*.gradle*', 'xposed/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-lsposed-gradle-

      - name: Build and verify
        working-directory: xposed
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease verifyBottomBarPolicy verifySettingsRules verifyJsonFeatures verifyPlayerRules lintRelease

      - name: Upload LSPosed APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliRoamingX-LSPosed-${{ github.sha }}
          path: xposed/build/outputs/apk/release/BiliRoamingX-LSPosed-release.apk
          if-no-files-found: error
